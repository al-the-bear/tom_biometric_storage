name: tom_biometric_storage
description: |
  The Tom Framework's fork of biometric_storage: an encrypted data store
  secured by the OS's biometric check, with Windows Hello (key-bound) and a
  gate-only macOS form for ad-hoc signed apps, and tom_core_storage's
  TomGatedSecretStore over it.
version: 6.0.0-dev.10+tom.1
homepage: https://enterprise-flutter.dev
repository: https://github.com/al-the-bear/tom_biometric_storage

environment:
  sdk: ^3.10.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  logging: ">=1.0.0 <2.0.0"
  plugin_platform_interface: ">=2.0.0 <3.0.0"

  ffi: '>=2.1.0 <3.0.0'
  win32: '>=6.0.1 <7.0.0'
  web: ">=0.5.0 <2.0.0"
  # The port the Tom apps' OS unlock implements (lib/tom_gated_secret_store.dart).
  tom_core_storage: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The androidPackage and pluginClass identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: design.codeux.biometric_storage
        pluginClass: BiometricStoragePlugin
      ios:
        pluginClass: BiometricStoragePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: BiometricStoragePlugin
        sharedDarwinSource: true
      linux:
        pluginClass: BiometricStoragePlugin
      windows:
        # No dartFileName: the generated registrant imports the package's own
        # barrel, which re-exports Win32BiometricStoragePlugin. (The `fileName`
        # key that used to sit here is a web-only key and was never read.)
        dartPluginClass: Win32BiometricStoragePlugin
        # The native half of Windows Hello (windows/windows_hello.cpp).
        pluginClass: BiometricStoragePluginCApi
      web:
        pluginClass: BiometricStoragePluginWeb
        fileName: src/biometric_storage_web.dart

topics:
  - biometrics
  - encryption
  - storage
  - security
  - secure-storage
screenshots:
  - description: 'Face ID on iPhone'
    path: doc/screenshot_ios.png
